version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      documentation:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /clients/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-client:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: mix
    directory: /clients/elixir
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      elixir-client:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
